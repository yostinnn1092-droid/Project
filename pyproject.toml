[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baccarat-streak-bot"
version = "0.1.0"
description = "Streak-triggered baccarat bot with a single martingale step, built on StakeAPI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# NOTE: install stakeapi from GitHub, not PyPI. Both call themselves
# 0.1.0, but the PyPI build predates Cloudflare support and has no
# cf_clearance/user_agent parameters at all -- it cannot authenticate
# against stake.com. The GitHub HEAD has them.
live = [
    "stakeapi @ git+https://github.com/brokechubb/StakeAPI.git",
    "aiohttp>=3.9",
]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "black", "isort", "mypy"]

[project.scripts]
baccarat-bot = "baccarat_bot.cli:main"

[tool.setuptools.packages.find]
include = ["baccarat_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90
