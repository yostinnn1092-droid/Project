<title>The Naming — combat slice</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1014">
<style>
  :root {
    --ink:   #e9e6df;
    --dim:   #9a9488;
    --gold:  #f0b829;
    --blood: #b8352c;
    --will:  #5a7fd0;
    --panel: rgba(12,14,17,.62);
    --edge:  rgba(233,230,223,.14);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1014; color: var(--ink); font-family: var(--sans);
    touch-action: none; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  /* ── vitals, top left ─────────────────────────────────────────────── */
  #vitals { position: absolute; top: 12px; left: 12px; width: min(42vw, 230px); }
  .bar {
    position: relative; height: 13px; border-radius: 3px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--edge); margin-bottom: 5px;
  }
  .bar i { position: absolute; inset: 0 auto 0 0; display: block; transition: width .12s linear; }
  #hpFill   { background: linear-gradient(90deg, #8e241d, var(--blood)); }
  #willFill { background: linear-gradient(90deg, #2f4a86, var(--will)); }
  .bar b {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 5px; font-family: var(--mono); font-size: 9px; font-weight: 400;
    color: rgba(255,255,255,.82); text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  #family { margin-top: 8px; }
  .famHead {
    font-family: var(--mono); font-size: 8px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 4px;
  }
  .fam {
    position: relative; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 3px; padding: 3px 6px; margin-bottom: 3px;
    font-size: 11px; overflow: hidden;
  }
  .fam span { position: relative; z-index: 1; }
  .fam b { color: var(--gold); }
  .fam i {
    position: absolute; left: 0; top: 0; bottom: 0; display: block;
    background: rgba(90,127,208,.22);
  }
  .fam.dimmed { color: var(--dim); font-style: italic; opacity: .7; }

  /* ── the naming prompt ────────────────────────────────────────────── */
  #prompt, #pending, #flash {
    position: absolute; left: 50%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity .16s ease;
    text-shadow: 0 2px 8px rgba(0,0,0,.95); white-space: nowrap;
  }
  #prompt {
    bottom: 132px; font-size: clamp(13px, 3.6vw, 19px); font-weight: 600;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 5px;
    padding: 7px 16px; backdrop-filter: blur(7px);
  }
  #pending { bottom: 108px; font-size: clamp(11px, 3vw, 15px); color: var(--gold); }
  #flash   { top: 16%; font-size: clamp(13px, 3.6vw, 20px); font-weight: 600; color: var(--gold); }
  #prompt.on, #pending.on, #flash.on { opacity: 1; }

  #dead {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: clamp(24px, 8vw, 54px); font-weight: 700; letter-spacing: .06em;
    color: var(--blood); background: rgba(10,6,6,.5);
    opacity: 0; transition: opacity .5s ease;
  }
  #dead.on { opacity: 1; }

  /* ── touch controls ───────────────────────────────────────────────── */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #stick {
    position: absolute; left: max(16px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: 116px; height: 116px; border-radius: 50%;
    border: 1.5px solid rgba(233,230,223,.16);
    background: radial-gradient(circle, rgba(233,230,223,.07), rgba(233,230,223,.02));
    pointer-events: auto; touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px;
    margin: -25px 0 0 -25px; border-radius: 50%;
    background: rgba(233,230,223,.22); border: 1.5px solid rgba(233,230,223,.38);
  }

  .btn {
    position: absolute; border-radius: 50%; pointer-events: auto; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink);
    border: 1.5px solid var(--edge); background: rgba(20,23,27,.5);
    backdrop-filter: blur(5px); transition: transform .08s ease, background .08s ease;
  }
  .btn.on { transform: scale(.92); background: rgba(233,230,223,.2); }

  #bAttack {
    right: max(18px, env(safe-area-inset-right)); bottom: max(60px, calc(env(safe-area-inset-bottom) + 44px));
    width: 92px; height: 92px; font-size: 11px;
    border-color: rgba(184,53,44,.6); background: rgba(120,32,26,.32);
  }
  #bDodge {
    right: max(122px, calc(env(safe-area-inset-right) + 104px));
    bottom: max(22px, env(safe-area-inset-bottom)); width: 66px; height: 66px;
  }
  #bName {
    right: max(24px, calc(env(safe-area-inset-right) + 6px));
    bottom: max(162px, calc(env(safe-area-inset-bottom) + 146px));
    width: 66px; height: 66px; opacity: .34;
  }
  /* Lights up only when something is actually down, so the button itself is
     the tell that a wolf can be taken rather than finished. */
  #bName.live {
    opacity: 1; border-color: var(--gold); background: rgba(240,184,41,.2);
    box-shadow: 0 0 20px rgba(240,184,41,.35);
  }
  #bCycle {
    right: max(96px, calc(env(safe-area-inset-right) + 78px));
    bottom: max(170px, calc(env(safe-area-inset-bottom) + 154px));
    width: 48px; height: 48px; font-size: 8px; opacity: .55;
  }

  #keys {
    position: absolute; top: 12px; right: 12px; text-align: right;
    font-family: var(--mono); font-size: 9px; line-height: 1.65; color: var(--dim);
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 4px; padding: 6px 9px;
  }
  #keys b { color: var(--ink); font-weight: 400; }
  /* On a touch screen the on-screen buttons ARE the legend. */
  @media (pointer: coarse) { #keys { display: none; } }
  @media (pointer: fine) { #touch { display: none; } }
</style>

<canvas id="gl"></canvas>

<div id="hud">
  <div id="vitals">
    <div class="bar"><i id="hpFill" style="width:100%"></i><b id="hpText">160 / 160</b></div>
    <div class="bar"><i id="willFill" style="width:100%"></i><b id="willText">100 / 100</b></div>
    <div id="family"></div>
  </div>

  <div id="keys">
    <b>WASD</b> move · <b>Shift</b> run<br>
    <b>Drag</b> look · <b>Click</b> attack<br>
    <b>Space</b> dodge<br>
    <b>F</b> name · <b>Tab</b> other name
  </div>

  <div id="prompt"></div>
  <div id="pending"></div>
  <div id="flash"></div>
  <div id="dead">You died.</div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bAttack">Attack</div>
    <div class="btn" id="bDodge">Dodge</div>
    <div class="btn" id="bName">Name</div>
    <div class="btn" id="bCycle">Other</div>
  </div>
</div>

<script>/*__THREE__*/</script>
<script>/*__GAME__*/</script>
